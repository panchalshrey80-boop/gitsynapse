name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The two suites that need no browser. `test:ui`, `test:init` and
      # `test:identity` drive headless Chrome, which puppeteer downloads during
      # `npm ci`; add them here once you have confirmed your runner has the
      # libraries Chrome needs.
      - run: npm run test:api
      - run: npm run test:paths
